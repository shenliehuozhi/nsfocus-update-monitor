<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>绿盟升级监控</title>
<link rel="stylesheet" href="/static/css/app.css">
<body>

<header class="header hidden" id="header">
  <button class="nav-toggle" data-on-click="toggleMobileNav" aria-label="菜单" title="菜单">
    <span>☰</span>
    <span id="nav-toggle-badge" class="nav-toggle-badge" title="有待确认的自动发现结果"></span>
  </button>
  <h1>🛡️ 绿盟升级监控</h1>
  <nav class="nav" id="mainNav">
    <a href="#" class="active" data-page="observability">仪表盘</a>
    <a href="#" data-page="sessions">Session</a>
    <a href="#" data-page="channels">通知渠道</a>
    <a href="#" data-page="subscriptions">订阅规则</a>
    <a href="#" data-page="customers">客户</a>
    <a href="#" data-page="data">采集数据</a>
    <a href="#" data-page="history">推送历史</a>
    <a href="#" data-page="settings">系统配置</a>
    <a href="#" data-page="products">产品管理<span id="nav-pending-badge" class="nav-badge" title="有待确认的自动发现结果">待确认</span></a>
    <a href="#" data-page="logs">事件与日志</a>
    <a href="#" data-page="tools">🛠️ 其他工具</a>
  </nav>
  <div class="user flex items-center gap6 h-full">
    <span class="conn-badge" id="versionBadge" data-on-click="showAboutModal" title="点击查看版本信息">…</span>
    <button class="user-avatar-btn" data-on-click="showAboutModal" title="关于 / 版本信息">i</button>
    <div class="pos-rel d-inline-block" id="userMenu">
      <span class="user-menu-btn" id="uname" data-on-click="toggleUserMenu" data-args='["$event"]' title="点击打开用户菜单">
        <span id="unameText"></span>
        <span class="fs10 opacity-70">▾</span>
      </span>
      <div id="userDropdown" class="user-dropdown hidden">
        <div class="menu-item" data-on-click="_menuShowPwd">🔒 修改密码</div>
        <div class="menu-item menu-item-sep" data-on-click="_menuLogout">🚪 退出登录</div>
      </div>
    </div>
  </div>
</header>
<div class="main" id="app"></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/data.js"></script>
<script src="/static/js/data_push.js"></script>
<script src="/static/js/pages.js"></script>
<script src="/static/js/history.js"></script>
<script src="/static/js/products.js"></script>
<script src="/static/js/collection.js"></script>
<script src="/static/js/events_center.js"></script>
<script src="/static/js/observability.js"></script>
<script src="/static/js/account.js"></script>
<script src="/static/js/bootstrap.js"></script>

<!-- ─────────────────────────────────────────────────────────────
  其他工具 (tools page) — 卡片列表 + 规则库 Diff 子页
  ───────────────────────────────────────────────────────────── -->
<div id="rdToast" class="rd-toast hidden"></div>
<script src="/static/js/tools.js"></script>
</body>
</html>
