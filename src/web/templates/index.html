<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>绿盟升级监控</title>
<link rel="stylesheet" href="/static/css/app.css">
<body>

<header class="header" id="header" data-css="display:none">
  <button class="nav-toggle" data-on-click="toggleMobileNav" aria-label="菜单" title="菜单">
    <span>☰</span>
    <span id="nav-toggle-badge" class="nav-toggle-badge" title="有待确认的自动发现结果"></span>
  </button>
  <h1>🛡️ 绿盟升级监控</h1>
  <nav class="nav" id="mainNav">
    <a href="#" class="active" data-page="dashboard">仪表盘</a>
    <a href="#" data-page="sessions">Session</a>
    <a href="#" data-page="channels">通知渠道</a>
    <a href="#" data-page="subscriptions">订阅规则</a>
    <a href="#" data-page="customers">客户</a>
    <a href="#" data-page="data">采集数据</a>
    <a href="#" data-page="history">推送历史</a>
    <a href="#" data-page="settings">系统配置</a>
    <a href="#" data-page="products">产品管理<span id="nav-pending-badge" class="nav-badge" title="有待确认的自动发现结果">待确认</span></a>
    <a href="#" data-page="logs">系统日志</a>
    <a href="#" data-page="observability">可观测</a>
    <a href="#" data-page="tools">🛠️ 其他工具</a>
  </nav>
  <div class="user" data-css="display:flex;align-items:center;gap:6px;height:100%">
    <span id="versionBadge" data-on-click="showAboutModal" title="点击查看版本信息" data-css="display:inline-flex;align-items:center;cursor:pointer;font-family:monospace;font-size:11px;font-weight:600;color:var(--primary-text);padding:2px 7px;border-radius:4px;background:var(--primary-light);border:1px solid transparent;line-height:1.4;white-space:nowrap;user-select:none">…</span>
    <button data-on-click="showAboutModal" title="关于 / 版本信息" data-css="background:var(--primary-light);color:var(--primary-text);border:1px solid transparent;padding:0;border-radius:50%;cursor:pointer;font-size:13px;font-weight:700;line-height:1;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif">i</button>
    <div id="userMenu" data-css="position:relative;display:inline-block">
      <span id="uname" data-on-click="toggleUserMenu" data-args='["$event"]' title="点击打开用户菜单" data-css="font-size:11px;color:#cbd5e1;opacity:.85;cursor:pointer;user-select:none;padding:4px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:4px">
        <span id="unameText"></span>
        <span data-css="font-size:10px;opacity:.7">▾</span>
      </span>
      <div id="userDropdown" data-css="display:none;position:absolute;top:calc(100% + 6px);right:0;background:#1e293b;border:1px solid #334155;border-radius:6px;min-width:140px;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:9999;overflow:hidden">
        <div class="menu-item" data-on-click="_menuShowPwd" data-css="padding:9px 14px;cursor:pointer;color:#e2e8f0;font-size:12px">🔒 修改密码</div>
        <div class="menu-item" data-on-click="_menuLogout" data-css="padding:9px 14px;cursor:pointer;color:#e2e8f0;font-size:12px;border-top:1px solid #334155">🚪 退出登录</div>
      </div>
    </div>
  </div>
</header>
<div class="main" id="app"></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/data.js"></script>
<script src="/static/js/pages.js"></script>
<script src="/static/js/history.js"></script>
<script src="/static/js/products.js"></script>
<script src="/static/js/collection.js"></script>
<script src="/static/js/observability.js"></script>
<script src="/static/js/account.js"></script>
<script src="/static/js/bootstrap.js"></script>

<!-- ─────────────────────────────────────────────────────────────
  其他工具 (tools page) — 卡片列表 + 规则库 Diff 子页
  ───────────────────────────────────────────────────────────── -->
<div id="rdToast" class="rd-toast"></div>
<script src="/static/js/tools.js"></script>
</body>
</html>
